name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Benchmarks are compiled so API changes can't break them unnoticed, but not run: shared runners are too noisy.
      # Javadoc is built strictly, so missing or broken docs fail here rather than at release time.
      - run: ./gradlew build jmhClasses javadoc
